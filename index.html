<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acquisition HUD</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
}

.hud {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 28px;
}

.brand {
  font-size: 13px;
  letter-spacing: 3px;
  opacity: .45;
  margin-bottom: 8px;
}

h1 {
  margin: 0 0 22px 0;
  font-size: 30px;
  font-weight: 600;
}

.subtitle {
  font-size: 14px;
  opacity: .5;
  margin-top: -15px;
  margin-bottom: 24px;
}

.menu {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.item {
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 20px;
  opacity: .42;
  transition: .15s ease;
}

.item.active {
  background: rgba(255,255,255,.15);
  opacity: 1;
}

.hint {
  margin-top: 22px;
  font-size: 12px;
  opacity: .4;
}

.screen {
  display: none;
}

.screen.active-screen {
  display: flex;
}

.stats {
  display: flex;
  gap: 12px;
  margin-bottom: 22px;
}

.stat {
  flex: 1;
  padding: 14px 10px;
  background: rgba(255,255,255,.08);
  border-radius: 10px;
  text-align: center;
}

.number {
  font-size: 26px;
  font-weight: 600;
}

.label {
  margin-top: 4px;
  font-size: 11px;
  opacity: .55;
}

.event {
  font-size: 15px;
  opacity: .7;
  margin-bottom: 20px;
}

.back {
  margin-top: 22px;
  font-size: 13px;
  opacity: .45;
}
</style>
</head>

<body>

<!-- MAIN MENU -->

<section id="home" class="hud screen active-screen">

  <div class="brand">A-D</div>
  <h1>Acquisition HUD</h1>

  <div class="menu" id="mainMenu">
    <div class="item active">Networking</div>
    <div class="item">Prospects</div>
    <div class="item">Meetings</div>
    <div class="item">Follow Ups</div>
    <div class="item">Dashboard</div>
  </div>

  <div class="hint">
    ↑ ↓ Navigate &nbsp; • &nbsp; Enter to Select
  </div>

</section>


<!-- NETWORKING MODE -->

<section id="networking" class="hud screen">

  <div class="brand">NETWORKING MODE</div>
  <h1>Today's Event</h1>

  <div class="event">
    Montgomery County Hispanic Chamber
  </div>

  <div class="stats">

    <div class="stat">
      <div class="number">5</div>
      <div class="label">CONVERSATIONS</div>
    </div>

    <div class="stat">
      <div class="number">2</div>
      <div class="label">COI CONNECTIONS</div>
    </div>

    <div class="stat">
      <div class="number">1</div>
      <div class="label">MEETING</div>
    </div>

  </div>

  <div class="menu" id="networkMenu">

    <div class="item active">
      Quick Capture
    </div>

    <div class="item">
      Event Notes
    </div>

    <div class="item">
      Follow Ups
    </div>

  </div>

  <div class="back">
    ESC ← Back
  </div>

</section>


<script>

const mainItems = document.querySelectorAll("#mainMenu .item");

let selected = 0;

function updateSelection() {

  mainItems.forEach(item => {
    item.classList.remove("active");
  });

  mainItems[selected].classList.add("active");
}

document.addEventListener("keydown", function(event) {

  if (
    document
      .getElementById("home")
      .classList
      .contains("active-screen")
  ) {

    if (event.key === "ArrowDown") {

      selected++;

      if (selected >= mainItems.length) {
        selected = 0;
      }

      updateSelection();
    }

    if (event.key === "ArrowUp") {

      selected--;

      if (selected < 0) {
        selected = mainItems.length - 1;
      }

      updateSelection();
    }

    if (event.key === "Enter" && selected === 0) {

      document
        .getElementById("home")
        .classList
        .remove("active-screen");

      document
        .getElementById("networking")
        .classList
        .add("active-screen");
    }
  }

  else {

    if (event.key === "Escape") {

      document
        .getElementById("networking")
        .classList
        .remove("active-screen");

      document
        .getElementById("home")
        .classList
        .add("active-screen");
    }
  }

});

</script>

</body>
</html>
